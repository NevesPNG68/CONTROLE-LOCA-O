<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Atami — Controle de Locação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="assets/chart.umd.min.js"></script>
<script src="assets/xlsx.full.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --sidebar-w:248px;
}
html[data-theme="dark"]{
  --bg:#0A1513; --bg-1:#0E1B19; --bg-2:#132623; --bg-3:#183330;
  --border:#1E3936; --border-soft:#16302C;
  --text-1:#EAF3F0; --text-2:#9DB3AE; --text-3:#5E7873;
  --teal:#33C9B8; --teal-dim:#1D6E64; --teal-glow:rgba(51,201,184,.16);
  --gold:#EFB24A; --gold-dim:#8A6420; --gold-glow:rgba(239,178,74,.14);
  --coral:#F0705A; --coral-dim:#7A3327; --coral-glow:rgba(240,112,90,.16);
  --shadow:0 12px 32px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#E5ECE9; --bg-1:#F3F7F5; --bg-2:#FFFFFF; --bg-3:#F8FAF9;
  --border:#BFCFC9; --border-soft:#D1DDD9;
  --text-1:#0E211E; --text-2:#344E49; --text-3:#5B746E;
  --teal:#0E7A6D; --teal-dim:#B9E2DA; --teal-glow:rgba(14,122,109,.14);
  --gold:#956400; --gold-dim:#F3D89F; --gold-glow:rgba(149,100,0,.14);
  --coral:#B43B28; --coral-dim:#F2C7BE; --coral-glow:rgba(180,59,40,.13);
  --shadow:0 12px 28px rgba(20,40,35,.14);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--text-1);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--teal-glow); color:var(--text-1);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ LAYOUT ============ */
#shell{display:flex; min-height:100vh;}

/* ---- SIDEBAR ---- */
#sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--bg-1);
  border-right:1px solid var(--border-soft); display:flex; flex-direction:column;
  position:fixed; top:0; bottom:0; left:0; z-index:40; transition:transform .25s ease;
}
#sidebar .brand{
  display:flex; align-items:center; gap:10px; padding:22px 20px 18px;
  border-bottom:1px solid var(--border-soft);
}
.brand-mark{
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  background:linear-gradient(150deg,var(--teal) 0%,var(--gold) 130%);
  display:flex; align-items:center; justify-content:center;
}
.brand-mark svg{width:19px; height:19px;}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-text b{font-family:var(--font-display); font-size:16.5px; letter-spacing:.2px;}
.brand-text span{font-size:11px; color:var(--text-3); letter-spacing:.4px; text-transform:uppercase;}

#sidebar nav{flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:3px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--text-2); font-size:14px; font-weight:500; border:none; background:transparent;
  text-align:left; width:100%; position:relative; transition:background .15s, color .15s;
}
.nav-item svg{width:18px; height:18px; flex-shrink:0; opacity:.85;}
.nav-item:hover{background:var(--bg-2); color:var(--text-1);}
.nav-item.active{background:var(--teal-glow); color:var(--teal); font-weight:600;}
.nav-item.active svg{opacity:1;}
.nav-badge{
  margin-left:auto; font-family:var(--font-mono); font-size:10.5px; padding:1px 6px;
  border-radius:20px; background:var(--coral-glow); color:var(--coral); font-weight:600;
}
.nav-section-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-3);
  padding:14px 12px 6px;
}
#sidebar .foot{padding:14px 20px 18px; border-top:1px solid var(--border-soft);}
.foot-occ{display:flex; align-items:center; gap:10px;}
.foot-occ-ring{width:36px; height:36px; flex-shrink:0;}
.foot-occ b{font-family:var(--font-display); font-size:15px; display:block;}
.foot-occ span{font-size:10.5px; color:var(--text-3);}

/* ---- MAIN ---- */
#main{margin-left:var(--sidebar-w); flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:space-between; padding:16px 28px; gap:16px;
}
#topbar .title-wrap{display:flex; flex-direction:column; gap:2px;}
#topbar h1{font-family:var(--font-display); font-size:21px; font-weight:600;}
#topbar .sub{font-size:12.5px; color:var(--text-3);}
#topbar .actions{display:flex; align-items:center; gap:10px;}
.period-filter{display:flex;align-items:center;gap:7px;padding:4px 6px 4px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-2);}
.period-filter label{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-2);}
.period-filter .select{width:auto;min-width:88px;border:0;background:transparent;padding-top:4px;padding-bottom:4px;}
.period-filter .period-arrow{color:var(--text-2);font-size:12px;}
.period-filter:focus-within{border-color:var(--teal-dim);box-shadow:0 0 0 3px var(--teal-glow);}
html[data-theme="dark"] .period-filter .select option{background:var(--bg-2);color:var(--text-1);}
.channel-select{width:136px;}
#menuToggle{display:none;}

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:600; border:1px solid var(--border); background:var(--bg-2); color:var(--text-1);
  transition:transform .1s, border-color .15s, background .15s;
}
.btn svg{width:15px; height:15px;}
.btn:hover{border-color:var(--teal); }
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal-dim)); color:#06231F; border:none;}
html[data-theme="dark"] .btn-primary{color:#04211C;}
.btn-primary:hover{filter:brightness(1.08); border-color:transparent;}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--bg-2); border-color:var(--border);}
.btn-danger{color:var(--coral); border-color:var(--coral-dim);}
.btn-danger:hover{background:var(--coral-glow); border-color:var(--coral);}
.btn-sm{padding:6px 10px; font-size:12.5px;}
.icon-btn{
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-2); color:var(--text-2);
}
.icon-btn:hover{color:var(--text-1); border-color:var(--teal);}
.icon-btn svg{width:16px; height:16px;}

select.select, .field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--bg-2); color:var(--text-1); font-size:13.5px; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal);}
select.select{padding:8px 30px 8px 11px; font-weight:600; font-size:13px;}

#view-root{padding:24px 28px 60px; flex:1;}

/* ============ CARDS / GRID ============ */
.grid{display:grid; gap:16px;}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.card{
  background:var(--bg-2); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  padding:18px 20px; box-shadow:var(--shadow);
}
.card-flat{box-shadow:none;}
.card h3{font-family:var(--font-display); font-size:14.5px; font-weight:600; margin-bottom:2px;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.card-head .hint{font-size:11.5px; color:var(--text-3);}

.kpi{display:flex; flex-direction:column; gap:6px;}
.kpi .lbl{font-size:11.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.4px; font-weight:600;}
.kpi .val{font-family:var(--font-display); font-size:25px; font-weight:600; letter-spacing:-.3px;}
.kpi .delta{font-size:11.5px; color:var(--text-2); font-family:var(--font-mono);}
.kpi .delta.up{color:var(--teal);}
.kpi .delta.down{color:var(--coral);}
.kpi-accent-teal{border-color:var(--teal-dim); background:linear-gradient(160deg,var(--teal-glow),transparent 60%);}
.kpi-accent-gold{border-color:var(--gold-dim); background:linear-gradient(160deg,var(--gold-glow),transparent 60%);}
.kpi-accent-coral{border-color:var(--coral-dim); background:linear-gradient(160deg,var(--coral-glow),transparent 60%);}

.pill{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px;
  border-radius:20px; text-transform:uppercase; letter-spacing:.3px;
}
.pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.pill-teal{background:var(--teal-glow); color:var(--teal);}
.pill-gold{background:var(--gold-glow); color:var(--gold);}
.pill-coral{background:var(--coral-glow); color:var(--coral);}
.pill-muted{background:var(--bg-3); color:var(--text-3);}

/* ============ DASHBOARD HERO ============ */
.hero{display:grid; grid-template-columns:270px 1fr; gap:18px; margin-bottom:18px;}
.hero-ring-card{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px;}
.ring-wrap{position:relative; width:168px; height:168px;}
.ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
.ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-label b{font-family:var(--font-display); font-size:30px; letter-spacing:-.5px;}
.ring-label span{font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.4px;}

.hero-side{display:flex; flex-direction:column; gap:16px;}
.mini-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media(max-width:1100px){.mini-grid{grid-template-columns:repeat(2,1fr);}}

/* ============ CALENDAR ============ */
.cal-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
.cal-nav{display:flex; align-items:center; gap:8px;}
.cal-month-label{font-family:var(--font-display); font-size:19px; font-weight:600; min-width:190px; text-align:center; text-transform:capitalize;}
.cal-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-2);}
.cal-legend .item{display:flex; align-items:center; gap:6px;}
.legend-swatch{width:12px; height:12px; border-radius:4px;}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.cal-dow{font-size:11px; font-weight:700; color:var(--text-3); text-align:center; text-transform:uppercase; letter-spacing:.5px; padding-bottom:4px;}
.cal-cell{
  position:relative; min-height:96px; border-radius:var(--radius-sm); border:1px solid var(--border-soft);
  background:var(--bg-1); padding:8px; display:flex; flex-direction:column; gap:5px; cursor:pointer; overflow:hidden;
  transition:border-color .15s, transform .1s;
}
.cal-cell:hover{border-color:var(--teal); transform:translateY(-1px);}
.cal-cell.blank{background:transparent; border-color:transparent; cursor:default;}
.cal-cell.blank:hover{transform:none; border-color:transparent;}
.cal-cell .num{font-family:var(--font-mono); font-size:12.5px; font-weight:600; color:var(--text-2);}
.cal-cell.today{border-color:var(--gold);}
.cal-cell.today .num{color:var(--gold);}
.cal-cell.available{background:var(--bg-1);}
.cal-cell.available::after{
  content:""; position:absolute; left:8px; right:8px; bottom:7px; height:2px; border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--teal-dim) 0 5px, transparent 5px 9px); opacity:.55;
}
.cal-cell.rented{background:linear-gradient(160deg,var(--teal-glow),var(--bg-1) 75%); border-color:var(--teal-dim);}
.cal-cell.rented .num{color:var(--teal);}
.cal-cell.tentative{background:linear-gradient(160deg,var(--gold-glow),var(--bg-1) 75%); border-color:var(--gold-dim); border-style:dashed;}
.cal-cell.tentative .num{color:var(--gold);}
.cal-cell.conflict{background:repeating-linear-gradient(135deg,var(--coral-glow) 0 8px, transparent 8px 16px), var(--bg-1); border-color:var(--coral);}
.cal-cell.conflict .num{color:var(--coral);}
.cal-guest{font-size:11px; font-weight:600; line-height:1.25; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.cal-tag{font-family:var(--font-mono); font-size:9.5px; color:var(--text-3);}
.cal-cell .checkbadge{position:absolute; top:6px; right:7px; font-size:8px; font-weight:800; letter-spacing:.3px;}

.cal-summary-bar{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-top:18px;}
@media(max-width:1000px){.cal-summary-bar{grid-template-columns:repeat(3,1fr);}}
.sum-chip{background:var(--bg-1); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:11px 13px;}
.sum-chip .l{font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.3px;}
.sum-chip .v{font-family:var(--font-mono); font-size:15px; font-weight:600; margin-top:3px;}

/* ============ TABLES ============ */
.table-wrap{overflow-x:auto; border:1px solid var(--border-soft); border-radius:var(--radius-lg); background:var(--bg-2);}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:760px;}
thead th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-3);
  padding:12px 14px; border-bottom:1px solid var(--border-soft); white-space:nowrap; font-weight:700;
  position:sticky; top:0; background:var(--bg-2);
}
tbody td{padding:12px 14px; border-bottom:1px solid var(--border-soft); white-space:nowrap; color:var(--text-1);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg-1);}
td.num, th.num{font-family:var(--font-mono);}
.row-actions{display:flex; gap:6px;}
.empty-state{padding:50px 20px; text-align:center; color:var(--text-3);}
.empty-state svg{width:38px; height:38px; margin-bottom:10px; opacity:.6;}
.empty-state b{display:block; color:var(--text-1); margin-bottom:4px; font-family:var(--font-display);}

.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; justify-content:space-between;}
.toolbar-left{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.search-box{position:relative;}
.search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-3);}
.search-box input{padding-left:32px; min-width:220px;}

/* ============ MODAL ============ */
#modal-overlay{
  position:fixed; inset:0; background:rgba(4,10,9,.55); backdrop-filter:blur(2px); z-index:90;
  display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto;
}
#modal-overlay.open{display:flex;}
.modal{
  background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow);
  width:100%; max-width:640px; animation:pop .18s ease;
}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border-soft);}
.modal-head h2{font-family:var(--font-display); font-size:17px; font-weight:600;}
.modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border-soft);}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid .span2{grid-column:1/-1;}
.field label{display:block; font-size:11.5px; font-weight:600; color:var(--text-2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.3px;}
.field .calc-note{font-size:11px; color:var(--text-3); margin-top:4px;}
fieldset{border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:14px; margin-top:4px;}
legend{font-size:11.5px; font-weight:700; color:var(--teal); padding:0 6px; text-transform:uppercase; letter-spacing:.4px;}
.form-msg{font-size:12.5px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:14px; display:none;}
.form-msg.show{display:block;}
.form-msg.error{background:var(--coral-glow); color:var(--coral); border:1px solid var(--coral-dim);}
.form-msg.warn{background:var(--gold-glow); color:var(--gold); border:1px solid var(--gold-dim);}

/* toggle switch */
.switch{position:relative; width:46px; height:26px; border-radius:20px; background:var(--bg-3); border:1px solid var(--border); flex-shrink:0;}
.switch i{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--text-2); transition:.18s;}
.switch.on{background:var(--teal-glow); border-color:var(--teal-dim);}
.switch.on i{transform:translateX(20px); background:var(--teal);}

/* toast */
#toast-wrap{position:fixed; bottom:20px; right:20px; z-index:120; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--bg-2); border:1px solid var(--border); color:var(--text-1); padding:12px 16px; border-radius:var(--radius-sm);
  font-size:13px; box-shadow:var(--shadow); display:flex; align-items:center; gap:9px; animation:in .18s ease; min-width:220px;
}
.toast svg{width:16px; height:16px; flex-shrink:0;}
.toast.ok{border-color:var(--teal-dim); color:var(--teal);}
.toast.err{border-color:var(--coral-dim); color:var(--coral);}
@keyframes in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

/* charts row */
.chart-box{position:relative; height:260px; width:100%;}
.chart-box canvas{position:absolute; inset:0; width:100% !important; height:100% !important;}
.chart-box.tall{height:320px;}
.attention-clear{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius-md);background:var(--teal-glow);color:var(--text-2);}
.attention-clear .avatar{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);}
.attention-clear>div:last-child{min-width:0;}
.attention-clear b{display:block;color:var(--text-1);font-size:13px;margin-bottom:2px;}
.attention-clear span{display:block;font-size:12px;color:var(--text-3);}
.dashboard-financial-card{margin-bottom:16px;}
.dashboard-summary-grid{display:grid;grid-template-columns:minmax(0,1.45fr) repeat(2,minmax(230px,1fr));gap:16px;align-items:stretch;}
.summary-card{min-width:0;min-height:158px;display:flex;flex-direction:column;}
.summary-card .card-head{margin-bottom:12px;}
.summary-card .list-row{padding:8px 0;}
.summary-card .attention-clear{flex:1;}
.channel-list{display:grid;gap:12px;}
.channel-row-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12px;}
.channel-row-head b{font-size:13px;}
.channel-row-head span{font-family:var(--font-mono);font-weight:600;}
.channel-meter{height:7px;margin-top:7px;border-radius:999px;background:var(--border-soft);overflow:hidden;}
.channel-meter i{display:block;height:100%;border-radius:inherit;background:var(--teal);}
.channel-share{display:block;margin-top:5px;color:var(--text-3);font-size:11px;}
.two-col{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
.two-col-equal{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
.two-col > *, .two-col-equal > *{min-width:0;}
.chart-fallback{
  height:100%; min-height:180px; display:flex; align-items:center; justify-content:center;
  padding:24px; border:1px dashed var(--border); border-radius:var(--radius-md);
  color:var(--text-3); font-size:12.5px; text-align:center; line-height:1.5;
}
@media(max-width:980px){
  .two-col{grid-template-columns:1fr;}
  .dashboard-summary-grid{grid-template-columns:1fr 1fr;}
  .upcoming-card{grid-column:1/-1;}
}

/* upcoming list */
.list-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-soft);}
.list-row:last-child{border-bottom:none;}
.list-row .avatar{

<script>
/* =========================================================================
   CASA ATAMI — CONTROLE DE LOCAÇÃO
   App single-file. Persistência via window.storage, localStorage ou memória.
   ========================================================================= */

/* ---------------- ICONS ---------------- */
const ICONS = {
  dashboard:'<path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z"/>',

  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',

  x:'<path d="M18 6 6 18M6 6l12 12"/>',

  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
};
function icon(name,size=18){return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;}

/* ---------------- CONSTANTS ---------------- */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_ABR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DOW = ['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
const STATUS_LIST = ['Consulta','Pré-reserva','Confirmada','Concluída','Cancelada'];
const CANAL_LIST = ['Direto','Airbnb','Booking','Imobiliária','Indicação','Outro'];
const CATEGORIA_DESPESA = ['Condomínio','Água','Luz','IPTU / Impostos','Manutenção','Limpeza','Seguro','Internet / TV','Reforma / Investimento','Outro'];
const BLOCKING_STATUSES = ['Confirmada','Concluída','Pré-reserva'];
const CONFIRMED_STATUSES = ['Confirmada','Concluída'];
const STATUS_COLOR = {'Confirmada':'teal','Concluída':'teal','Pré-reserva':'gold','Consulta':'muted','Cancelada':'coral'};

/* ---------------- STORAGE ---------------- */
const StorageAPI = {
  memory:{ reservas:null, despesas:null, settings:null },
  prefix:'mare-controle-locacao:',
  async get(key){
    try{
      if(window.storage){ const r = await window.storage.get(key,false); return r? JSON.parse(r.value): null; }
    }catch(e){ /* key not found or unavailable */ }
    try{
      const saved = window.localStorage.getItem(this.prefix+key);
      if(saved !== null) return JSON.parse(saved);
    }catch(e){ /* localStorage indisponível */ }
    return this.memory[key] ?? null;
  },
  async set(key,val){
    this.memory[key]=val;
    try{
      if(window.storage){ await window.storage.set(key, JSON.stringify(val), false); return; }
    }catch(e){ /* tenta o fallback local */ }
    try{ window.localStorage.setItem(this.prefix+key,JSON.stringify(val)); }
    catch(e){ console.warn('Persistência indisponível; usando memória temporária.',e); }
  }
};

/* ---------------- SEED DATA (a partir da planilha Controle_Locacao.xlsx) ---------------- */
function seedReservas(){
  return [{
    id:'LOC-001', hospede:'Exemplo — Natal/Ano Novo', checkin:'2026-12-25', checkout:'2027-01-04',
    valorDiaria:1100, periodo:'Natal / Réveillon', status:'Confirmada', canal:'Direto',
    agua:0, luz:0, limpeza:0, diarista:0, manutencao:0, investimento:0, taxas:0, outros:0,
    recebido:0, observacoes:'25/12/2026 a 04/01/2027 = 10 diárias (exemplo da planilha original).'
  }];
}
function seedDespesas(){
  return [{
    id:'DESP-001', data:'2026-12-26', categoria:'Condomínio', descricao:'Condomínio referente à locação de exemplo',
    valor:100, reservaId:'LOC-001', observacoes:''
  }];
}

/* ---------------- STATE ---------------- */
let state = {
  theme:'dark',
  view:'dashboard',
  periodStart:'2026-01',
  periodEnd:'2026-12',
  channel:'',
  calMonth: 11, // 0-indexed; default Dezembro (matches seed reservation)
  calYear: 2026,
  reservas: [],
  despesas: [],
  filters:{ reservas:{ search:'', status:'', canal:'' }, despesas:{ search:'', categoria:'' } },
  sidebarOpen:false,
  sourceLoadedAt:null,
};

/* ---------------- DATE HELPERS ---------------- */
function pad(n){return String(n).padStart(2,'0');}
function toKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ const d=parseISO(s); if(!d) return '—'; return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function diffNights(checkinS,checkoutS){ const a=parseISO(checkinS), b=parseISO(checkoutS); if(!a||!b) return 0; return Math.round((b-a)/86400000); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function isLeap(y){ return (y%4===0 && y%100!==0)||y%400===0; }
function daysInYear(y){ return isLeap(y)?366:365; }
function todayKey(){ return toKey(new Date()); }
function fmtMoney(v){ v = v||0; return 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtPct(v){ return ((v||0)*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; }
function fmtNum(v){ return (v||0).toLocaleString('pt-BR'); }
function safeText(value){
  return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
}

/* ---------------- WORKBOOK SOURCE ---------------- */
function excelDateToISO(value){
  if(!value) return '';
  if(value instanceof Date && !Number.isNaN(value.getTime())){
    return value.getUTCFullYear()+'-'+pad(value.getUTCMonth()+1)+'-'+pad(value.getUTCDate());
  }
  if(typeof value==='number'){
    const parsed = XLSX.SSF.parse_date_code(value);
    return parsed? parsed.y+'-'+pad(parsed.m)+'-'+pad(parsed.d):'';
  }
  if(typeof value==='string'){
    const iso=value.match(/^(\d{4})-(\d{2})-(\d{2})/); if(iso) return iso[0];
    const br=value.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(br) return br[3]+'-'+pad(br[2])+'-'+pad(br[1]);
  }
  return '';
}
function readSheetRows(workbook,name){
  const sheet=workbook.Sheets[name];
  if(!sheet) throw new Error('A aba "'+name+'" não foi encontrada na planilha.');
  return XLSX.utils.sheet_to_json(sheet,{header:1,raw:true,defval:null});
}
function parseReservas(rows){
  return rows.slice(5).filter(row=>row[0] && row[1]).map(row=>({
    id:safeText(row[0]).trim(), hospede:safeText(row[1]).trim(), checkin:excelDateToISO(row[2]), checkout:excelDateToISO(row[3]),
    valorDiaria:Number(row[5]||0), periodo:safeText(row[7]), status:safeText(row[8]||'Consulta'), canal:safeText(row[9]||'Outro'),
    agua:Number(row[10]||0), luz:Number(row[11]||0), limpeza:Number(row[12]||0), diarista:Number(row[13]||0),
    manutencao:Number(row[14]||0), investimento:Number(row[15]||0), taxas:Number(row[16]||0), outros:Number(row[17]||0),
    recebido:Number(row[23]||0), observacoes:safeText(row[26])
  })).filter(r=>r.checkin && r.checkout);
}
function parseDespesas(rows){
  return rows.slice(5).filter(row=>row[0] && Number(row[3]||0)!==0).map((row,index)=>({
    id:'DESP-'+String(index+1).padStart(3,'0'), data:excelDateToISO(row[0]), categoria:safeText(row[1]||'Outro'),
    descricao:safeText(row[2]), valor:Number(row[3]||0), reservaId:safeText(row[4]).trim(), observacoes:safeText(row[5])
  })).filter(e=>e.data);
}
async function loadWorkbookData(){
  if(typeof XLSX==='undefined') throw new Error('O leitor de Excel não foi carregado.');
  const response=await fetch('Controle_Locacao.xlsx?v='+Date.now(),{cache:'no-store'});
  if(!response.ok) throw new Error('Não foi possível carregar Controle_Locacao.xlsx.');
  const workbook=XLSX.read(await response.arrayBuffer(),{type:'array',cellDates:true});
  state.reservas=parseReservas(readSheetRows(workbook,'RESERVAS'));
  state.despesas=parseDespesas(readSheetRows(workbook,'DESPESAS CASA'));
  state.sourceLoadedAt=new Date();
}
function updateSourceStatus(error){
  const el=document.getElementById('sourceStatus'); if(!el) return;
  if(error){ el.className='source-status error'; el.textContent='Falha na planilha'; return; }
  el.className='source-status';
  el.textContent='Planilha atualizada · '+state.sourceLoadedAt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

/* Returns array of night keys occupied by a reservation: [checkin, checkout) */
function nightsOf(r){
  const a = parseISO(r.checkin), b = parseISO(r.checkout);
  if(!a||!b||b<=a) return [];
  const out=[]; let cur=new Date(a);
  while(cur<b){ out.push(toKey(cur)); cur=addDays(cur,1); }
  return out;
}
/* How many of a reservation's nights fall in a given year/month */
function nightsInMonth(r,year,month){
  return nightsOf(r).filter(k=>{ const d=parseISO(k); return d.getFullYear()===year && d.getMonth()===month; }).length;
}
function nightsInYear(r,year){
  return nightsOf(r).filter(k=> parseISO(k).getFullYear()===year ).length;
}

/* ---------------- COMPUTED RESERVATION FIELDS ---------------- */
function linkedExpensesTotal(id){
  return state.despesas.filter(e=>e.reservaId===id).reduce((s,e)=>s+Number(e.valor||0),0);
}
function computeR(r){
  const nights = diffNights(r.checkin,r.checkout);
  const grossRevenue = nights * Number(r.valorDiaria||0);
  const manualCosts = ['agua','luz','limpeza','diarista','manutencao','investimento','taxas','outros'].reduce((s,k)=>s+Number(r[k]||0),0);
  const linked = linkedExpensesTotal(r.id);
  const directCosts = manualCosts + linked;
  const netProfit = grossRevenue - directCosts;
  const margin = grossRevenue>0? netProfit/grossRevenue : 0;
  const costPerNight = nights>0? directCosts/nights:0;
  const profitPerNight = nights>0? netProfit/nights:0;
  const balance = grossRevenue - Number(r.recebido||0);
  return {nights,grossRevenue,manualCosts,linkedExpenses:linked,directCosts,netProfit,margin,costPerNight,profitPerNight,balance};
}
function blocking(r){ return BLOCKING_STATUSES.includes(r.status); }
function confirmedSt(r){ return CONFIRMED_STATUSES.includes(r.status); }
function channelMatches(r){ return !state.channel || r.canal===state.channel; }
function channelLabel(){ return state.channel || 'Todos os canais'; }

/* Conflicts: reservations (blocking) that share at least one night with another blocking reservation */
function findConflicts(){
  const blockers = state.reservas.filter(r=>blocking(r) && channelMatches(r));
  const map = {}; // nightKey -> [ids]
  blockers.forEach(r=>{ nightsOf(r).forEach(k=>{ (map[k]=map[k]||[]).push(r.id); }); });
  const conflictIds = new Set();
  Object.values(map).forEach(ids=>{ if(ids.length>1) ids.forEach(id=>conflictIds.add(id)); });
  return conflictIds;
}
function conflictNightSet(excludeId){
  const blockers = state.reservas.filter(r=>blocking(r) && channelMatches(r) && r.id!==excludeId);
  const set = new Set();
  blockers.forEach(r=>nightsOf(r).forEach(k=>set.add(k)));
  return set;
}

/* ---------------- MONTH / YEAR STATS ---------------- */
function computeMonthStats(year,month){
  const dias = daysInMonth(year,month);
  let alugadasSet = new Set(), tentativeSet = new Set(), reservasSet = new Set();
  let receitaConf=0, receitaProj=0, custosConf=0, custosProj=0;
  state.reservas.forEach(r=>{
    if(!blocking(r)) return;
    if(!channelMatches(r)) return;
    const n = nightsInMonth(r,year,month);
    if(n<=0) return;
    reservasSet.add(r.id);
    const c = computeR(r);
    const revShare = c.nights>0? c.grossRevenue*(n/c.nights):0;
    const costShare = c.nights>0? c.directCosts*(n/c.nights):0;
    nightsOf(r).forEach(k=>{ const d=parseISO(k); if(d.getFullYear()===year&&d.getMonth()===month){ alugadasSet.add(k); if(!confirmedSt(r)) tentativeSet.add(k); } });
    if(confirmedSt(r)){ receitaConf+=revShare; custosConf+=costShare; }
    receitaProj+=revShare; custosProj+=costShare;
  });
  const despesasGerais = state.despesas.filter(e=>{
    if(e.reservaId) return false; // linked ones already counted inside directCosts
    const d=parseISO(e.data); return d && d.getFullYear()===year && d.getMonth()===month;
  }).reduce((s,e)=>s+Number(e.valor||0),0);
  const alugadas = alugadasSet.size;
  const disponiveis = dias - alugadas;
  const ocupacao = dias>0? alugadas/dias:0;
  const lucroConf = receitaConf - custosConf - despesasGerais;
  const lucroProj = receitaProj - custosProj - despesasGerais;
  return {dias,alugadas,diarias:alugadas,reservas:reservasSet.size,disponiveis,ocupacao,receitaConf,receitaProj,custosConf,custosProj,despesasGerais,lucroConf,lucroProj,
    margemConf: receitaConf>0?lucroConf/receitaConf:0, tentativeNights:tentativeSet.size};
}
function monthKey(year,month){ return `${year}-${pad(month+1)}`; }
function parseMonthKey(key){ const [year,month]=key.split('-').map(Number); return {year,month:month-1}; }
function periodMonths(startKey=state.periodStart,endKey=state.periodEnd){
  const start=parseMonthKey(startKey), end=parseMonthKey(endKey), months=[];
  let cursor=new Date(start.year,start.month,1), last=new Date(end.year,end.month,1);
  while(cursor<=last){
    const year=cursor.getFullYear(), month=cursor.getMonth();
    months.push({year,month,key:monthKey(year,month),label:`${MESES_ABR[month]}/${String(year).slice(-2)}`,stats:computeMonthStats(year,month)});
    cursor=new Date(year,month+1,1);
  }
  return months;
}
function dateInPeriod(date){
  if(!date) return false;
  const key=monthKey(date.getFullYear(),date.getMonth());
  return key>=state.periodStart && key<=state.periodEnd;
}
function reservationInPeriod(r){ return nightsOf(r).some(k=>dateInPeriod(parseISO(k))); }
function computePeriodStats(){
  const period = periodMonths();
  const months = period.map(item=>item.stats);
  const dias = months.reduce((total,item)=>total+item.dias,0);
  const sum = (k)=>months.reduce((s,m)=>s+m[k],0);
  const alugadas = sum('alugadas');
  const receitaConf = sum('receitaConf'), receitaProj=sum('receitaProj');
  const custosConf = sum('custosConf'), custosProj=sum('custosProj');
  const despesasGerais = sum('despesasGerais');
  const lucroConf = receitaConf-custosConf-despesasGerais;
  const lucroProj = receitaProj-custosProj-despesasGerais;
  const disponiveis = dias-alugadas;
  const ocupacao = dias>0? alugadas/dias:0;
  const adr = alugadas>0? receitaConf/alugadas:0;
  const revpar = dias>0? receitaConf/dias:0;
  const reservasPeriodo = state.reservas.filter(r=>blocking(r) && channelMatches(r) && reservationInPeriod(r));
  const reservasConfPeriodo = reservasPeriodo.filter(confirmedSt);
  const losMedio = reservasPeriodo.length? reservasPeriodo.reduce((s,r)=>s+diffNights(r.checkin,r.checkout),0)/reservasPeriodo.length:0;
  const ticketMedio = reservasConfPeriodo.length? receitaConf/reservasConfPeriodo.length:0;
  const saldoReceber = reservasPeriodo.reduce((s,r)=>s+computeR(r).balance,0);
  return {period,months,dias,alugadas,disponiveis,ocupacao,receitaConf,receitaProj,custosConf,custosProj,despesasGerais,
    lucroConf,lucroProj,margemConf:receitaConf>0?lucroConf/receitaConf:0,adr,revpar,losMedio,ticketMedio,saldoReceber,
    numReservas:reservasPeriodo.length,diarias:alugadas};
}
function channelBreakdown(){
  const map={};
  state.reservas.forEach(r=>{
    if(!blocking(r) || !channelMatches(r)) return;
    const n=nightsOf(r).filter(k=>dateInPeriod(parseISO(k))).length; if(n<=0) return;
    const c = computeR(r); const share = c.nights>0? c.grossRevenue*(n/c.nights):0;
    map[r.canal]=map[r.canal]||{receita:0,count:0}; map[r.canal].receita+=share; map[r.canal].count+=1;
  });
  return map;
}

function ringSVG(pct, size=168, stroke=14, colorVar='--teal'){
  const r=(size-stroke)/2, c=size/2, circ=2*Math.PI*r;
  const off = circ*(1-Math.min(1,pct));
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(${colorVar})" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
  </svg>`;
}

function filteredDespesas(){
  const f = state.filters.despesas;
  return state.despesas.filter(e=>{
    if(!dateInPeriod(parseISO(e.data))) return false;
    if(f.categoria && e.categoria!==f.categoria) return false;
    if(f.search){ const s=f.search.toLowerCase(); if(!((e.descricao||'').toLowerCase().includes(s)||(e.id||'').toLowerCase().includes(s))) return false; }
    return true;
  }).sort((a,b)=>parseISO(b.data)-parseISO(a.data));
}

function confirmDelete(kind,id){
  const label = kind==='reserva'? 'reserva':'despesa';
  openModal(`
    <div class="modal-head"><h2>Excluir ${label}?</h2><button class="icon-btn" id="mClose">${icon('x',16)}</button></div>
    <div class="modal-body"><p style="font-size:13.5px;color:var(--text-2);">Esta ação não pode ser desfeita. O registro <b style="color:var(--text-1)">${id}</b> será removido permanentemente.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancelar</button>
      <button class="btn btn-danger" id="mConfirm">${icon('trash',14)} Excluir</button></div>`);
  document.getElementById('mClose').addEventListener('click',closeModal);
  document.getElementById('mCancel').addEventListener('click',closeModal);
  document.getElementById('mConfirm').addEventListener('click',()=>{
    if(kind==='reserva'){ state.reservas = state.reservas.filter(x=>x.id!==id); StorageAPI.set('reservas',state.reservas); }
    else{ state.despesas = state.despesas.filter(x=>x.id!==id); StorageAPI.set('despesas',state.despesas); }
    closeModal(); toast('Excluído com sucesso.'); render();
  });
}

function exportData(){
  const blob = new Blob([JSON.stringify({reservas:state.reservas,despesas:state.despesas,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);

function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(Array.isArray(parsed.reservas)) state.reservas = parsed.reservas;
      if(Array.isArray(parsed.despesas)) state.despesas = parsed.despesas;
      StorageAPI.set('reservas',state.reservas); StorageAPI.set('despesas',state.despesas);
      toast('Dados importados com sucesso.'); render();
    }catch(err){ toast('Arquivo inválido.','err'); }
  };
  reader.readAsText(file);
}

  const years=[];
  state.reservas.forEach(r=>{ const a=parseISO(r.checkin), b=parseISO(r.checkout); if(a) years.push(a.getFullYear()); if(b) years.push(b.getFullYear()); });
  state.despesas.forEach(e=>{ const d=parseISO(e.data); if(d) years.push(d.getFullYear()); });
  const currentYear=parseMonthKey(state.periodStart).year;
  const minYear=Math.min(currentYear,...years), maxYear=Math.max(currentYear,...years);
  const options=[];
  for(let year=minYear;year<=maxYear;year++) for(let month=0;month<12;month++) options.push({key:monthKey(year,month),label:`${MESES_ABR[month]}/${String(year).slice(-2)}`});
  return options;
}
function syncPeriodSelects(){
  const options=availablePeriodOptions();
  [['periodStart',state.periodStart],['periodEnd',state.periodEnd]].forEach(([id,value])=>{
    const select=document.getElementById(id);
    select.innerHTML=options.map(item=>`<option value="${item.key}" ${item.key===value?'selected':''}>${item.label}</option>`).join('');
  });
  updateFootRing();
}
function syncChannelSelect(){
  const select=document.getElementById('channelSelect');
  if(!select) return;
  select.innerHTML='<option value="">Todos os canais</option>'+CANAL_LIST.map(c=>`<option value="${c}" ${c===state.channel?'selected':''}>${c}</option>`).join('');
}
function changePeriod(changed){
  const start=document.getElementById('periodStart').value, end=document.getElementById('periodEnd').value;
  if(start>end){
    if(changed==='start'){ state.periodStart=start; state.periodEnd=start; }
    else{ state.periodStart=end; state.periodEnd=end; }
  }else{
    state.periodStart=start; state.periodEnd=end;
  }
  render();
}
document.getElementById('periodStart').addEventListener('change',()=>changePeriod('start'));
document.getElementById('periodEnd').addEventListener('change',()=>changePeriod('end'));
document.getElementById('channelSelect').addEventListener('change',e=>{ state.channel=e.target.value; render(); });

/* ---------------- MAIN RENDER DISPATCH ---------------- */
function render(){
  renderNav();
  syncSidebar();
  syncPeriodSelects();
  syncChannelSelect();
  updateThemeIcon();
  const map = {dashboard:viewDashboard, agenda:viewAgenda, reservas:viewReservas, despesas:viewDespesas, relatorios:viewRelatorios, config:viewConfig};
  (map[state.view]||viewDashboard)();
}

document.getElementById('themeToggle').addEventListener('click',toggleTheme);

/* ---------------- BOOT ---------------- */
async function boot(){
  const savedSettings = await StorageAPI.get('settings');
  if(savedSettings && savedSettings.theme){ state.theme=savedSettings.theme; document.documentElement.setAttribute('data-theme',state.theme); }

  document.getElementById('view-root').innerHTML='<div class="loading-state"><div><b>Carregando Controle_Locacao.xlsx</b>Lendo reservas, despesas e indicadores...</div></div>';
  try{
    await loadWorkbookData();
    updateSourceStatus();
  }catch(error){
    console.error(error);
    updateSourceStatus(error);
    document.getElementById('view-root').innerHTML=`<div class="loading-state"><div><b>Não foi possível carregar a planilha</b>${error.message}<br><small>Confirme se Controle_Locacao.xlsx está na mesma pasta do index.html.</small></div></div>`;
    return;
  }

  // default calendar and filter to the full year of the latest check-in
  if(state.reservas.length){
    const latest = [...state.reservas].sort((a,b)=>parseISO(b.checkin)-parseISO(a.checkin))[0];
    const d0 = parseISO(latest.checkin);
    state.calMonth = d0.getMonth(); state.calYear = d0.getFullYear();
    state.periodStart = `${d0.getFullYear()}-01`; state.periodEnd = `${d0.getFullYear()}-12`;
  }
  render();
  toast(`${state.reservas.length} reserva(s) e ${state.despesas.length} despesa(s) carregadas.`);
}
boot();
</script>
